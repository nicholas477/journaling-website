[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
axum-routes = "0.2.3"
time = { version = "0.3", features = ["formatting"] }
ammonia = "4"

[build-dependencies]
syn = { version = "2", features = ["clone-impls"] }
