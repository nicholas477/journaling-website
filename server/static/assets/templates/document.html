<div class="page-heading document-page-heading">
    <div>
        <a class="back-link" href="/">← Library</a>
        <h1 data-document-title></h1>
        <p class="article-subtitle" data-document-subtitle hidden></p>
        <p class="document-byline">Updated <time data-updated-at></time></p>
    </div>
    <div class="document-actions">
        <a class="button button-outline" data-edit-link>Edit note</a>
        <button class="button button-danger" type="button" data-delete-button>Delete note</button>
    </div>
</div>

<section class="reader" aria-label="Rendered note">
    <article id="document-content" class="article-content" aria-label="Document content"></article>
</section>
